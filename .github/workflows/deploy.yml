name: Provision & Configure K3s

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------------
  # 1) AWS Infra Job: 순수 인프라 생성 (VPC, EC2, NLB 등)
  # -------------------------------------------------------------------
  aws_infra:
    name: Deploy AWS Infrastructure
    runs-on: [ self-hosted, Linux, X64 ]
    permissions:
      id-token: write
      contents: read
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Terraform Init
        working-directory: terraform/aws-infra
        run: terraform init

      - name: Terraform Apply (AWS)
        working-directory: terraform/aws-infra
        run: terraform apply -auto-approve

  # -------------------------------------------------------------------
  # 2) Tailscale Job: 인프라 확정 후 ACL 설정 (412 에러 해결)
  # -------------------------------------------------------------------
  tailscale_config:
    name: Configure Tailscale ACL
    needs: aws_infra  # AWS 인프라 작업 완료 후 실행
    runs-on: [ self-hosted, Linux, X64 ]
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      TF_VAR_ts_client_id: ${{ secrets.TS_CLIENT_ID }}
      TF_VAR_ts_client_secret: ${{ secrets.TS_CLIENT_SECRET }}
      TF_VAR_ts_tailnet: ${{ secrets.TAILSCALE_TAILNET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Tailscale Auth
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_CLIENT_SECRET }}
          tags: tag:k3s

      - name: Terraform Init
        working-directory: terraform/tailscale
        run: terraform init

      - name: Sync & Apply ACL
        working-directory: terraform/tailscale
        run: |
          # 1. 기존 ACL 정보를 State로 동기화 (Import)
          terraform import tailscale_acl.main_acl acl || echo "Import skipped"
          
          # 2. -replace 옵션으로 해시 충돌을 무시하고 강제 적용
          terraform apply -auto-approve -replace=tailscale_acl.main_acl

  # -------------------------------------------------------------------
  # 3) Ansible Job: 클러스터 구성
  # -------------------------------------------------------------------
  ansible:
    name: Configure K3s cluster & Deploy App
    runs-on: [ self-hosted, Linux, X64 ]
    needs: tailscale_config # ACL 설정까지 성공해야 실행
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      ANSIBLE_HOST_KEY_CHECKING: "False"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Tailscale Auth
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_CLIENT_SECRET }}
          tags: tag:k3s

      - name: Generate Temporary Authkey for Ansible
        id: generate_key
        run: |
          TOKEN=$(curl -u "${{ secrets.TS_CLIENT_ID }}:${{ secrets.TS_CLIENT_SECRET }}" -d "grant_type=client_credentials" https://api.tailscale.com/api/v2/oauth/token | jq -r .access_token)
          TEMP_KEY=$(curl -u "$TOKEN:" -d '{"capabilities":{"devices":{"create":{"reusable":false,"ephemeral":true,"preauthorized":true,"tags":["tag:k3s"]}}}}' https://api.tailscale.com/api/v2/tailnet/${{ secrets.TAILSCALE_TAILNET }}/keys | jq -r .key)
          echo "TS_TEMP_KEY=$TEMP_KEY" >> $GITHUB_ENV

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip jq
          python3 -m pip install boto3 botocore kubernetes PyYAML
          ansible-galaxy collection install kubernetes.core

      - name: Setup SSH private key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ANSIBLE_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: 🔬 Run Deploy Script
        working-directory: k3s-ansible
        run: |
          chmod +x deploy.sh
          export PYTHONPATH=$PYTHONPATH:$(python3 -m site --user-site)
          TAILSCALE_AUTHKEY=$TS_TEMP_KEY ./deploy.sh
