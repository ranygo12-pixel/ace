name: Provision & Configure K3s

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------------
  # 1) Terraform Job: 인프라 및 ACL 생성 (OAuth 기반)
  # -------------------------------------------------------------------
  terraform:
    name: Provision Infrastructure
    runs-on: [ self-hosted, Linux, X64 ]
    permissions:
      id-token: write
      contents: read
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      # [수정 완료] variables.tf의 이름들과 정확히 일치시켰습니다.
      TF_VAR_ts_client_id: ${{ secrets.TS_CLIENT_ID }}
      TF_VAR_ts_client_secret: ${{ secrets.TS_CLIENT_SECRET }}
      TF_VAR_ts_tailnet: ${{ secrets.TAILSCALE_TAILNET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Tailscale Auth
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_CLIENT_ID }}
          # [수정 완료] oauth-client-secret에서 oauth-secret으로 변경
          oauth-secret: ${{ secrets.TS_CLIENT_SECRET }}
          tags: tag:k3s

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Solve Dependency & Sync ACL
        working-directory: terraform
        run: |
          # ACL 상태 동기화 (412 에러 방지)
          terraform state rm tailscale_acl.main_acl || true
          terraform import -target=tailscale_acl.main_acl tailscale_acl.main_acl acl || true
          
          # [핵심] 로드밸런서 참조 오류 방지를 위한 타겟 생성
          terraform apply -target=aws_instance.k3s_agent -target=tailscale_acl.main_acl -auto-approve || echo "Target apply failed, but continuing..."

      - name: Terraform Apply (Final)
        working-directory: terraform
        run: terraform apply -auto-approve

  # -------------------------------------------------------------------
  # 2) Ansible Job: 클러스터 구성 (임시 키 생성 로직 포함)
  # -------------------------------------------------------------------
  ansible:
    name: Configure K3s cluster & Deploy App
    runs-on: [ self-hosted, Linux, X64 ]
    needs: terraform
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      ANSIBLE_HOST_KEY_CHECKING: "False"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Tailscale Auth
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_CLIENT_ID }}
          # [수정 완료] 여기도 oauth-secret으로 변경
          oauth-secret: ${{ secrets.TS_CLIENT_SECRET }}
          tags: tag:k3s

      - name: Generate Temporary Authkey for Ansible
        id: generate_key
        run: |
          TOKEN=$(curl -u "${{ secrets.TS_CLIENT_ID }}:${{ secrets.TS_CLIENT_SECRET }}" -d "grant_type=client_credentials" https://api.tailscale.com/api/v2/oauth/token | jq -r .access_token)
          TEMP_KEY=$(curl -u "$TOKEN:" -d '{"capabilities":{"devices":{"create":{"reusable":false,"ephemeral":true,"preauthorized":true,"tags":["tag:k3s"]}}}}' https://api.tailscale.com/api/v2/tailnet/${{ secrets.TAILSCALE_TAILNET }}/keys | jq -r .key)
          echo "TS_TEMP_KEY=$TEMP_KEY" >> $GITHUB_ENV

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip jq
          python3 -m pip install boto3 botocore kubernetes PyYAML
          ansible-galaxy collection install kubernetes.core

      - name: Setup SSH private key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ANSIBLE_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: 🔬 Run Deploy Script
        working-directory: k3s-ansible
      
        run: |
          chmod +x deploy.sh
          export PYTHONPATH=$PYTHONPATH:$(python3 -m site --user-site)
          TAILSCALE_AUTHKEY=$TS_TEMP_KEY ./deploy.sh
