name: Provision & Configure K3s

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------------
  # 1) Terraform Job: 인프라 및 ACL 생성
  # -------------------------------------------------------------------
  terraform:
    name: Provision Infrastructure
    runs-on: [ self-hosted, Linux, X64 ]
    permissions:
      id-token: write
      contents: read
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      # [수정] Terraform이 ACL을 수정할 수 있도록 관리자 API Key 주입
      TF_VAR_tailscale_api_key: ${{ secrets.TAILSCALE_API_KEY }}
      TF_VAR_tailscale_tailnet: ${{ secrets.TAILSCALE_TAILNET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Tailscale Auth
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }} # 러너 접속용은 Auth Key 유지
          tags: tag:k3s

      - name: Terraform Init
        working-directory: terraform
        run: terraform init
        
      # [핵심] 기존의 'grants' 구조를 포함한 현재 서버 상태를 테라폼에게 가르쳐줍니다.
      - name: Sync Existing ACL
        working-directory: terraform
        continue-on-error: true
        run: |
          terraform state rm tailscale_acl.main_acl || true
          terraform import tailscale_acl.main_acl acl

  # -------------------------------------------------------------------
  # 2) Ansible Job: 클러스터 구성 및 앱 배포
  # -------------------------------------------------------------------
  ansible:
    name: Configure K3s cluster & Deploy App
    runs-on: [ self-hosted, Linux, X64 ]
    needs: terraform
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      ANSIBLE_HOST_KEY_CHECKING: "False"
      # [추가] Ansible이 EC2 내부에서 사용할 정보들
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      TAILSCALE_TAILNET: ${{ secrets.TAILSCALE_TAILNET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Tailscale Auth
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          tags: tag:k3s

      - name: Install Dependencies (Python, boto3, jq)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip jq
          python3 -m pip install boto3 botocore kubernetes PyYAML
          ansible-galaxy collection install kubernetes.core

      - name: Setup SSH private key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ANSIBLE_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: 🔬 Run Deploy Script
        working-directory: k3s-ansible
        run: |
          chmod +x deploy.sh
          export PYTHONPATH=$PYTHONPATH:$(python3 -m site --user-site)
          ./deploy.sh
