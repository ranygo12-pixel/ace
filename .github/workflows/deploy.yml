name: Provision & Configure K3s

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------------
  # 1) AWS Infra Job: VPC, EC2, NLB 등 생성
  # -------------------------------------------------------------------
  aws_infra:
    name: Deploy AWS Infrastructure
    runs-on: [ self-hosted, Linux, X64 ]
    permissions:
      id-token: write
      contents: read
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Terraform Init
        working-directory: terraform/aws-infra
        run: terraform init

      - name: Terraform Apply (AWS)
        working-directory: terraform/aws-infra
        run: terraform apply -auto-approve

  # -------------------------------------------------------------------
  # 2) Tailscale Job: ACL 설정 (412 에러 해결 루틴 포함)
  # -------------------------------------------------------------------
  tailscale_config:
    name: Configure Tailscale ACL
    needs: aws_infra
    runs-on: [ self-hosted, Linux, X64 ]
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      TF_VAR_ts_client_id: ${{ secrets.TS_CLIENT_ID }}
      TF_VAR_ts_client_secret: ${{ secrets.TS_CLIENT_SECRET }}
      TF_VAR_ts_tailnet: ${{ secrets.TAILSCALE_TAILNET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Tailscale Auth
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_CLIENT_SECRET }} # [수정] 공식 파라미터명 준수
          tags: tag:k3s

      - name: Terraform Init & Sync ACL
        working-directory: terraform/tailscale
        run: |
          # [수정] 412 에러 해결: 기존 상태 파일을 지우고 서버 상태를 강제로 가져옴
          rm -rf .terraform* terraform.tfstate*
          terraform init
          terraform import tailscale_acl.main_acl acl || echo "Fresh start"
          
          # [수정] Apply 실패 시 상태를 제거하고 재동기화하는 안전장치 추가
          terraform apply -auto-approve || (
            terraform state rm tailscale_acl.main_acl
            terraform import tailscale_acl.main_acl acl
            terraform apply -auto-approve
          )

  # -------------------------------------------------------------------
  # 3) Ansible Job: 클러스터 구성 및 앱 배포
  # -------------------------------------------------------------------
  ansible:
    name: Configure K3s cluster & Deploy App
    runs-on: [ self-hosted, Linux, X64 ]
    needs: tailscale_config
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      ANSIBLE_HOST_KEY_CHECKING: "False"
      TS_CLIENT_ID: ${{ secrets.TS_CLIENT_ID }}
      TS_CLIENT_SECRET: ${{ secrets.TS_CLIENT_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive  #

      - name: Tailscale Auth
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_CLIENT_SECRET }}
          tags: tag:k3s

      - name: ⏳ Wait for Tailscale Network
        run: |
          echo "Waiting for Tailscale interface and routes to stabilize..."
          sleep 30
          tailscale status

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip jq
          python3 -m pip install boto3 botocore kubernetes PyYAML
          ansible-galaxy collection install kubernetes.core

      - name: Setup SSH private key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ANSIBLE_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: 🚀 Run Deploy Script
        working-directory: ./k3s-ansible
        run: |
          chmod +x deploy.sh
          ./deploy.sh  # 곧바로 실행
