name: Provision & Configure K3s

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------------
  # 1) Terraform Job: OAuth 인증 및 단계별 리소스 생성
  # -------------------------------------------------------------------
  terraform:
    name: Provision Infrastructure
    runs-on: [ self-hosted, Linux, X64 ]
    permissions:
      id-token: write
      contents: read
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      # [중요] 신규 발급받은 OAuth 정보 주입
      TF_VAR_ts_client_id: ${{ secrets.TS_CLIENT_ID }}
      TF_VAR_ts_client_secret: ${{ secrets.TS_CLIENT_SECRET }}
      TF_VAR_tailscale_tailnet: ${{ secrets.TAILSCALE_TAILNET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Tailscale Auth
        uses: tailscale/github-action@v2
        with:
          # 러너 접속용도 안전한 OAuth 방식으로 변경
          oauth-client-id: ${{ secrets.TS_CLIENT_ID }}
          oauth-client-secret: ${{ secrets.TS_CLIENT_SECRET }}
          tags: tag:k3s

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Phase 1: Sync ACL & Create Instances
        working-directory: terraform
        # outputs.tf의 로드밸런서 참조 에러를 피하기 위해 타겟을 지정합니다
        run: |
          # ACL 상태 동기화 (412 에러 방지)
          terraform state rm tailscale_acl.main_acl || true
          terraform import -target=tailscale_acl.main_acl tailscale_acl.main_acl acl
          
          # 인스턴스를 먼저 생성하여 ID를 확정 (로드밸런서와 Output은 이 단계에서 무시됨)
          terraform apply -target=aws_instance.k3s_agent -target=tailscale_acl.main_acl -auto-approve

      - name: Phase 2: Complete Infrastructure
        working-directory: terraform
        # 이제 인스턴스 ID가 존재하므로 로드밸런서와 outputs.tf가 정상 작동합니다
        run: terraform apply -auto-approve

  # -------------------------------------------------------------------
  # 2) Ansible Job: 클러스터 구성 및 앱 배포
  # -------------------------------------------------------------------
  ansible:
    name: Configure K3s cluster & Deploy App
    runs-on: [ self-hosted, Linux, X64 ]
    needs: terraform
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      ANSIBLE_HOST_KEY_CHECKING: "False"
      # Ansible 단계에서도 OAuth 정보를 사용하도록 설정 가능
      TS_CLIENT_ID: ${{ secrets.TS_CLIENT_ID }}
      TS_CLIENT_SECRET: ${{ secrets.TS_CLIENT_SECRET }}
      TAILSCALE_TAILNET: ${{ secrets.TAILSCALE_TAILNET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Tailscale Auth
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_CLIENT_ID }}
          oauth-client-secret: ${{ secrets.TS_CLIENT_SECRET }}
          tags: tag:k3s

      - name: Install Dependencies (Python, boto3, jq)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip jq
          python3 -m pip install boto3 botocore kubernetes PyYAML
          ansible-galaxy collection install kubernetes.core

      - name: Setup SSH private key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ANSIBLE_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: 🔬 Run Deploy Script
        working-directory: k3s-ansible
        run: |
          chmod +x deploy.sh
          export PYTHONPATH=$PYTHONPATH:$(python3 -m site --user-site)
          ./deploy.sh
