# 1. Prometheus 관련 설정
prometheus:
  prometheusSpec:
    retention: 10d
    # 스토리지 스펙 구체화 (Data Persistence)
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

# 2. Grafana 관련 설정
grafana:
  enabled: true
  adminUser: "admin"
  adminPassword: "admin"
  
  service:
    type: NodePort
    nodePort: 32000

  persistence:
    enabled: true
    size: 10Gi
    storageClassName: "local-path"
    
# 대시보드 공급자 설정  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: 'default'
          orgId: 1
          folder: 'K3s Cluster'
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default
            
#대시보드 자동 로드 (Zero-configuration)
  dashboards:
    default:
      k3s-cluster-19972:
        gnetId: 19972
        revision: 1
        datasource:
          - name: DS_PROMETHEUS
            value: Prometheus
